[project]
name = "stromex-api"
version = "0.1.0"
description = "StromeX API — English-Arabic AI Operating System backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "redis>=5.1.1",
    "qdrant-client>=1.11.3",
    "httpx>=0.27.2",
    "anthropic>=0.36.0",
    "openai>=1.51.0",
    "weasyprint>=62.3",
    "markdown>=3.7",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
    "mypy>=1.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
