org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Lets `gradle :core-audio:test` configure only the root project and :core-audio, so the
# Android module (which needs the SDK) is never touched on a JVM-only machine.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
