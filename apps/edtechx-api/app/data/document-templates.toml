lede.ar = "تشهد إدارة {institution_ar} بأن"
statement.en = "has satisfactorily completed the three-year Junior Secondary School programme at {school} for the academic session {session}, has met in full the academic and conduct requirements of the institution, and is hereby graduated and admitted to the Senior Secondary School."
statement.ar = "قد أتمّ بنجاحٍ متطلبات المرحلة الإعدادية في العام الدراسي {session}، وفقًا للمناهج المعتمدة والمعايير الأكاديمية المعمول بها في الكلية، وأُجيزَ له الانتقال إلى المرحلة الثانوية."
