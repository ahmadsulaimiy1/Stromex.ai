level = 3
border_weight = 0.82
security = ["constructed guilloché ground", "anti-copy line screens at 8° and 53°", "embossed khatam watermark", "serial-bearing fine-text rails", "engraved number cartouche", "Code 128 archive symbol", "QR verification bay", "void notice"]
