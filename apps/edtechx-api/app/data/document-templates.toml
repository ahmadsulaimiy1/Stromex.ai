[[template]]
key = "college-junior-secondary"
name = "Junior Secondary Graduation Certificate"
name_ar = "شهادة تخرج المرحلة الإعدادية"
family = "college"
sheet = "a4-landscape"
language = "peer"
scheme = "imperial"
code = "CERT"
security_class = "A"
peak_slot = "recipient"
peak_slot_ar = "recipient_ar"
