[[template]]
key = "college-primary"
name = "Primary School Graduation Certificate"
name_ar = "شهادة تخرج المرحلة الابتدائية"
family = "college"
sheet = "a4-landscape"
language = "peer"
scheme = "crimson"
code = "CERT"
security_class = "A"
peak_slot = "recipient"
peak_slot_ar = "recipient_ar"
provenance = "Imported from the benchmark press's college award. The citation runs in two columns rather than two stacked paragraphs — stacked it costs 26mm of a 138mm field and makes a reader of one language wait for the other."
notes = "No year count in the citation. The benchmark's own prospectus states an age range and never a number of primary years, so 'the six-year programme' would be invented — and an invented number on a permanent record is the error this whole library exists to avoid. Add the count when an institution confirms its own. The warm metal is deliberate: a parent holding this and a stage certificate must never have to work out which school issued which."
level = 2
border_weight = 0.82
security = ["constructed guilloché ground", "anti-copy line screens at 8° and 53°", "embossed khatam watermark", "serial-bearing fine-text rails", "engraved number cartouche", "Code 128 archive symbol", "QR verification bay", "void notice"]
title.en = "Certificate of Graduation"
title.ar = "شهادة تخرج"
subtitle.en = "Primary School Graduation Certificate"
subtitle.ar = "شهادة تخرج المرحلة الابتدائية"
lede.en = "This is to certify that"
lede.ar = "تشهد إدارة {institution_ar} بأن"
statement.en = "has satisfactorily completed the Primary School programme at {school} for the academic session {session}, has met in full the academic and conduct requirements of the institution, and is hereby graduated and admitted to the Junior Secondary School."
statement.ar = "قد أتمّ بنجاحٍ متطلبات المرحلة الابتدائية في العام الدراسي {session}، وفقًا للمناهج المعتمدة والمعايير الأكاديمية المعمول بها في الكلية، وأُجيزَ له الانتقال إلى المرحلة الإعدادية."
award.en = "Primary School Graduation Certificate"
award.ar = "شهادة تخرج المرحلة الابتدائية"
