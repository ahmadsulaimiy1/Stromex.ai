[[template]]
key = "stage-preparatory"
name = "Certificate of Tamhīdiyyah"
name_ar = "شهادة إتمام المرحلة التمهيدية"
family = "stage"
sheet = "a4-landscape"
language = "peer"
scheme = "imperial"
code = "CERT"
security_class = "A"
peak_slot = "recipient"
peak_slot_ar = "recipient_ar"
provenance = "Imported from the benchmark press's stage certificate. The stage wording, the citation sentence and the three-register particulars band are transcribed; the ground is re-cut as constructed geometry; every name is a slot."
notes = "The citation is set to three lines at this measure on purpose. The wording it replaced ran to four lines for the longer stage names, and the fourth line crossed the particulars band's rule — on every sheet of a printed batch. Re-measure before lengthening this sentence or adding a fifth stage."
level = 3
border_weight = 0.88
security = ["constructed guilloché ground", "anti-copy line screens at 8° and 53°", "embossed khatam watermark", "serial-bearing fine-text rails", "engraved number cartouche", "Code 128 archive symbol", "QR verification bay", "void notice"]
title.en = "Certificate of Tamhīdiyyah"
title.ar = "شهادة إتمام المرحلة التمهيدية"
subtitle.en = "Preparatory Stage Completion"
lede.en = "This is to certify that"
lede.ar = "تشهد إدارة {institution_ar} بأن"
statement.en = "has successfully completed the Tamhīdiyyah stage in the {session} academic session, in accordance with the approved curriculum and academic standards of the School."
statement.ar = "قد أتمّ بنجاحٍ متطلبات المرحلة التمهيدية في العام الدراسي {session}، وفقًا للمناهج المعتمدة والمعايير الأكاديمية المعمول بها في المدرسة."
[[template.registers]]
en = "Student ID"
ar = "الرقم التعريفي للطالب"
[[template.registers]]
en = "Date of Issue"
ar = "تاريخ الإصدار"
[[template.registers]]
en = "Place of Issue"
ar = "مكان الإصدار"
[template.verification]
identifiers = ["document_id", "verification_code", "serial", "archive_reference"]
barcode = true
qr = true
serial_rail = true
void_en = "Void if altered or erased"
void_ar = "لاغيةٌ عند أي كشطٍ أو تعديل"
[[template.slots]]
key = "institution"
label_en = "Institution"
label_ar = "المؤسسة"
kind = "text"
required = true
default = "Institution Name"
note = "The awarding body's registered name, as it appears on its instrument of establishment."
[[template.slots]]
key = "institution_ar"
label_en = "Institution (Arabic)"
label_ar = "المؤسسة بالعربية"
kind = "text_ar"
required = false
default = "اسم المؤسسة"
note = "Leave blank on a monolingual sheet — an empty Arabic run is resolved away, not printed as a gap."
[[template.slots]]
key = "school"
label_en = "School or faculty"
label_ar = "المدرسة"
kind = "text"
required = false
default = "School Name"
[[template.slots]]
key = "school_ar"
label_en = "School or faculty (Arabic)"
label_ar = "المدرسة بالعربية"
kind = "text_ar"
required = false
[[template.slots]]
key = "authority"
label_en = "Supervising authority"
label_ar = "الجهة المشرفة"
kind = "text"
required = false
note = "A ministry or board line, where the award is made under one. Left empty it is not printed, and no authority is implied that has not been named."
[[template.slots]]
key = "authority_ar"
label_en = "Supervising authority (Arabic)"
label_ar = "الجهة المشرفة بالعربية"
kind = "text_ar"
required = false
[[template.slots]]
key = "recipient"
label_en = "Recipient name"
label_ar = "اسم الحامل"
kind = "name"
required = true
default = "Recipient Full Name"
note = "The visual peak of the sheet. Set to the name the holder will be known by for life, not an abbreviated file name."
[[template.slots]]
key = "recipient_ar"
label_en = "Recipient name (Arabic)"
label_ar = "الاسم بالعربية"
kind = "name_ar"
required = false
note = "Never transliterated automatically. A person's name in another script is theirs to give."
[[template.slots]]
key = "student_id"
label_en = "Student identity number"
label_ar = "الرقم التعريفي للطالب"
kind = "identifier"
required = true
default = "000-0000-0000"
[[template.slots]]
key = "session"
label_en = "Academic session"
label_ar = "العام الدراسي"
kind = "text"
required = true
default = "2025 – 2026"
[[template.slots]]
key = "issued_on"
label_en = "Date of issue"
label_ar = "تاريخ الإصدار"
kind = "date"
required = true
default = "1 January 2026"
[[template.slots]]
key = "issued_on_hijri"
label_en = "Date of issue (Hijri)"
label_ar = "التاريخ الهجري"
kind = "date_hijri"
required = false
[[template.slots]]
key = "place"
label_en = "Place of issue"
label_ar = "مكان الإصدار"
kind = "text"
required = true
default = "City, State, Country"
[[template.slots]]
key = "place_ar"
label_en = "Place of issue (Arabic)"
label_ar = "مكان الإصدار بالعربية"
kind = "text_ar"
required = false
[[template.slots]]
key = "serial"
label_en = "Serial number"
label_ar = "الرقم التسلسلي"
kind = "identifier"
required = true
default = "XXX/0000/000000"
note = "Minted by the issuing register, never typed. It is what the border rail and the covert layers carry."
[[template.slots]]
key = "document_id"
label_en = "Document number"
label_ar = "رقم الوثيقة"
kind = "identifier"
required = true
default = "DID-2026-XXX-0000000"
[[template.slots]]
key = "verification_code"
label_en = "Verification code"
label_ar = "رمز التحقق"
kind = "identifier"
required = true
default = "0000-0000-0000"
[[template.slots]]
key = "archive_reference"
label_en = "Archive reference"
label_ar = "المرجع الأرشيفي"
kind = "identifier"
required = true
default = "ARCH/XXX/2026/000000"
[[template.slots]]
key = "verify_url"
label_en = "Verification address"
label_ar = "عنوان التحقق"
kind = "text"
required = true
default = "verify.example.edu"
note = "Printed on the face so the sheet is verifiable without the QR — a code with nowhere to take it is not verification."
[[template.slots]]
key = "original_reference"
label_en = "Original reference number"
label_ar = "رقم الوثيقة الأصلية"
kind = "identifier"
required = false
note = "Filled only on a duplicate, and required there. It is what makes a reissued sheet trace back to the one it replaces instead of standing beside it as a second original."
[[template.slots]]
key = "principal_name"
label_en = "Principal and Head of School — name"
label_ar = "رئيس المدرسة"
kind = "text"
required = true
default = "Principal and Head of School Name"
[[template.slots]]
key = "principal_name_ar"
label_en = "Principal and Head of School — name (Arabic)"
label_ar = "رئيس المدرسة (بالعربية)"
kind = "text_ar"
required = false
[[template.slots]]
key = "principal_ink"
label_en = "Principal and Head of School — signature"
label_ar = "التوقيع"
kind = "signature"
required = false
note = "A prepared transparent signature. Uploads are assessed and their paper removed before mounting."
[[template.slots]]
key = "chairman_name"
label_en = "Chairman, Board of Governors — name"
label_ar = "رئيس مجلس الإدارة"
kind = "text"
required = true
default = "Chairman, Board of Governors Name"
[[template.slots]]
key = "chairman_name_ar"
label_en = "Chairman, Board of Governors — name (Arabic)"
label_ar = "رئيس مجلس الإدارة (بالعربية)"
kind = "text_ar"
required = false
[[template.slots]]
key = "chairman_ink"
label_en = "Chairman, Board of Governors — signature"
label_ar = "التوقيع"
kind = "signature"
required = false
note = "A prepared transparent signature. Uploads are assessed and their paper removed before mounting."
[[template.slots]]
key = "seal"
label_en = "Institutional seal"
label_ar = "الختم الرسمي"
kind = "seal"
required = false
note = "An uploaded device is fitted inside the seal architecture — its own ring, legend and relief — rather than pasted on top of it."
[[template.signatories]]
key = "principal"
role_en = "Principal and Head of School"
role_ar = "رئيس المدرسة"
name_slot = "principal_name"
ink_slot = "principal_ink"
seal = true
[[template.signatories]]
key = "chairman"
role_en = "Chairman, Board of Governors"
role_ar = "رئيس مجلس الإدارة"
name_slot = "chairman_name"
ink_slot = "chairman_ink"
seal = false

