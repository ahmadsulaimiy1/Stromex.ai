[project]
name = "edtechx-api"
version = "0.1.0"
description = "EdTechX — multi-tenant education operating system, backend API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "RUF"]
# N818: our HTTP-shaped errors read better as `NotAuthenticated` than
# `NotAuthenticatedError`; they are named for the response, not the traceback.
# UP042: `str, Enum` is required for SQLAlchemy Enum columns to round-trip
# cleanly and for values to serialize without an explicit encoder.
# RUF002/RUF003: an en dash in prose is an en dash, not a typo. The rule
# exists for identifiers, which this codebase does not write in prose.
ignore = ["S101", "N818", "UP042", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S", "E402"]
