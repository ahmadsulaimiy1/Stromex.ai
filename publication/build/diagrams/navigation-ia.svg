<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="560" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — INFORMATION ARCHITECTURE AND NAVIGATION</text><rect x="340" y="32" width="220" height="40" rx="12" ry="12" fill="#12161E" stroke="#12161E" stroke-width="1.5"/><text x="450.0" y="56.68" font-family="Inter, 'Inter Display', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">SpaceTalk</text><text x="450" y="88" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="middle" font-weight="400">Four destinations. Maximum depth three levels. Adding a fifth requires CPO and CDO sign-off.</text><line x1="450" y1="72" x2="100" y2="104" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><rect x="0" y="106" width="208" height="40" rx="10" ry="10" fill="#3F5EF0" stroke="#3F5EF0" stroke-width="1.5"/><text x="104" y="131" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Chats</text><rect x="0" y="154" width="208" height="106" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="14" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Filter: All · Unread · Groups · Channels</text><text x="14" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Conversation rows — people, groups,</text><text x="14" y="208" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">channels and the assistant in ONE list</text><text x="14" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Archived (never badged)</text><text x="14" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#2438AE" text-anchor="start" font-weight="600">→ Conversation</text><line x1="450" y1="72" x2="328" y2="104" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><rect x="228" y="106" width="208" height="40" rx="10" ry="10" fill="#4C5464" stroke="#4C5464" stroke-width="1.5"/><text x="332" y="131" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Calls</text><rect x="228" y="154" width="208" height="58" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="242" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">History — all · missed</text><text x="242" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Start a call</text><line x1="450" y1="72" x2="556" y2="104" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><rect x="456" y="106" width="208" height="40" rx="10" ry="10" fill="#4C5464" stroke="#4C5464" stroke-width="1.5"/><text x="560" y="131" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Stories</text><rect x="456" y="154" width="208" height="90" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="470" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Others' stories</text><text x="470" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">My story + viewers (private)</text><text x="470" y="208" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Create — audience chosen</text><text x="470" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">   before posting, every time</text><line x1="450" y1="72" x2="784" y2="104" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><rect x="684" y="106" width="208" height="40" rx="10" ry="10" fill="#4C5464" stroke="#4C5464" stroke-width="1.5"/><text x="788" y="131" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">Settings</text><rect x="684" y="154" width="208" height="154" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="698" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Profile</text><text x="698" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Privacy</text><text x="698" y="208" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Devices</text><text x="698" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Notifications</text><text x="698" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Assistant</text><text x="698" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Storage &amp; data</text><text x="698" y="272" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Appearance</text><text x="698" y="288" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Help &amp; about</text><rect x="0" y="320" width="440" height="190" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="20" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#2438AE" text-anchor="start" font-weight="700">Conversation — the atomic unit of the product</text><rect x="20" y="358" width="400" height="30" rx="8" ry="8" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1"/><text x="34" y="377" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Transcript</text><text x="170" y="377" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">message runs, reply quotes, reactions</text><rect x="20" y="394" width="400" height="30" rx="8" ry="8" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1"/><text x="34" y="413" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Composer</text><text x="170" y="413" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">text · attach · voice · send — never moves</text><rect x="20" y="430" width="400" height="30" rx="8" ry="8" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1"/><text x="34" y="449" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Conversation profile</text><text x="170" y="449" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">members · media · files · links · encryption</text><rect x="20" y="466" width="400" height="30" rx="8" ry="8" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1"/><text x="34" y="485" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Search within</text><text x="170" y="485" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">local index, results in under 50 ms</text><rect x="460" y="320" width="440" height="190" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="480" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">The rules that keep it learnable</text><text x="480" y="366" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">A channel, a group, a person and the assistant differ in what</text><text x="480" y="381" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">they contain — not in where they live. One list, by recency.</text><text x="480" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="480" y="411" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">No hamburger menu. No nested tabs. No fifth destination.</text><text x="480" y="426" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="480" y="441" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Nothing lives in two places. A shortcut that duplicates a</text><text x="480" y="456" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Settings item creates a second mental model of the app.</text><text x="480" y="471" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="480" y="486" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Archived is a place, not a state to be badged.</text><text x="0" y="538" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="400">Global search spans conversations, messages, media, files and people — but is not a destination, because searching is something you do from somewhere.</text></svg>