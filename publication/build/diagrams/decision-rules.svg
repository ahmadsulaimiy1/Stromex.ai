<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="420" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — THE DECISION RULES, IN PRIORITY ORDER</text><text x="0" y="34" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#4C5464" text-anchor="start" font-weight="400">When a decision is genuinely close, apply these in order. A higher rule overrides a lower one.</text><rect x="0" y="56" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="78" r="11" fill="#3F5EF0"/><text x="24" y="82" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="44" y="83" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Uncertain?</text><path d="M250,78 L274,78" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="56" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="83" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Choose simplicity</text><text x="510" y="76" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">The simple version can be made powerful later.</text><text x="510" y="89" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">The complex version can almost never be made simple.</text><rect x="0" y="106" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="128" r="11" fill="#3F5EF0"/><text x="24" y="132" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="44" y="133" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Two features compete?</text><path d="M250,128 L274,128" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="106" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="133" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Ship the better experience</text><text x="510" y="133" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Even if the other tests better on engagement.</text><rect x="0" y="156" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="178" r="11" fill="#3F5EF0"/><text x="24" y="182" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="44" y="183" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">It exists because a rival has it?</text><path d="M250,178 L274,178" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="156" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="183" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Delete it</text><text x="510" y="183" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">“Parity” is not a user problem.</text><rect x="0" y="206" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="228" r="11" fill="#3F5EF0"/><text x="24" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="44" y="233" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Performance vs beauty?</text><path d="M250,228 L274,228" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="206" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="233" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Performance wins</text><text x="510" y="233" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">A beautiful interface that stutters is not beautiful.</text><rect x="0" y="256" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="278" r="11" fill="#3F5EF0"/><text x="24" y="282" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="44" y="283" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Cleverness vs usability?</text><path d="M250,278 L274,278" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="256" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="283" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Usability wins</text><text x="510" y="283" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Nobody has ever loved a product for being clever at them.</text><rect x="0" y="306" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="328" r="11" fill="#3F5EF0"/><text x="24" y="332" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="44" y="333" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Privacy vs capability?</text><path d="M250,328 L274,328" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="306" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="333" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Privacy by default</text><text x="510" y="326" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">The capability may be offered as an explicit,</text><text x="510" y="339" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">informed, revocable choice — never quietly.</text><rect x="0" y="356" width="250" height="44" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="24" cy="378" r="11" fill="#3F5EF0"/><text x="24" y="382" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text><text x="44" y="383" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Hard to reverse?</text><path d="M250,378 L274,378" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="280" y="356" width="210" height="44" rx="10" ry="10" fill="#3F5EF0"/><text x="295" y="383" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Take the reversible path</text><text x="510" y="383" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Buy time to learn.</text></svg>