<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="340" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — J4: A CONVERSATION ACROSS A LANGUAGE BARRIER</text><text x="0" y="34" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">The journey that most defines the product's differentiation.</text><rect x="0" y="52" width="430" height="250" rx="12" ry="12" fill="#FAFBFD" stroke="#D7DDE8" stroke-width="1.5"/><rect x="20" y="72" width="250" height="34" rx="18" ry="18" fill="#E9EDF4"/><text x="34" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">¿Nos vemos el jueves?</text><rect x="20" y="112" width="132" height="22" rx="11" ry="11" fill="#E6FAF6" stroke="#5FE3CE" stroke-width="1"/><text x="32" y="127" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#0A7466" text-anchor="start" font-weight="600">Translate</text><path d="M300,100 L300,128" fill="none" stroke="#0A7466" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="310" y="118" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">one tap</text><rect x="20" y="146" width="250" height="34" rx="18" ry="18" fill="#E9EDF4"/><text x="34" y="168" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">¿Nos vemos el jueves?</text><rect x="20" y="184" width="250" height="30" rx="8" ry="8" fill="#E6FAF6"/><text x="34" y="203" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#08594E" text-anchor="start" font-weight="400">Shall we meet on Thursday?</text><circle cx="258" cy="199" r="5" fill="#12B39B"/><text x="20" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="600">The original is always present and always primary.</text><text x="20" y="246" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">The translation is an annotation, never a replacement.</text><text x="20" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Tap the translation to collapse it. Names, @mentions,</text><text x="20" y="280" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">code and numbers are never translated.</text><circle cx="468" cy="68" r="10" fill="#0A7466"/><text x="468" y="72" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="488" y="65" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Detect</text><text x="488" y="79" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">per message, not per conversation — conversations code-switch</text><line x1="468" y1="80" x2="468" y2="90" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="468" cy="109" r="10" fill="#0A7466"/><text x="468" y="113" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="488" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Offer</text><text x="488" y="120" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">"Translate" appears; nothing is translated without a first tap</text><line x1="468" y1="121" x2="468" y2="131" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="468" cy="150" r="10" fill="#0A7466"/><text x="468" y="154" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="488" y="147" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Show</text><text x="488" y="161" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">beneath the original, in Aurora, labelled</text><line x1="468" y1="162" x2="468" y2="172" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="468" cy="191" r="10" fill="#0A7466"/><text x="468" y="195" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="488" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Persist</text><text x="488" y="202" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">"Always translate this conversation?" — a header indicator if accepted</text><line x1="468" y1="203" x2="468" y2="213" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="468" cy="232" r="10" fill="#0A7466"/><text x="468" y="236" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="488" y="229" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Reply</text><text x="488" y="243" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">optionally see the translation and back-translation before sending</text><line x1="468" y1="244" x2="468" y2="254" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="468" cy="273" r="10" fill="#0A7466"/><text x="468" y="277" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="488" y="270" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Disclose</text><text x="488" y="284" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">the recipient is told the message was translated, and by which side</text><rect x="460" y="302" width="440" height="0" rx="0" ry="0" fill="#FFFFFF"/><text x="0" y="322" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Hidden translation would create a false impression of shared fluency — so it is disclosed. Low-confidence output is labelled "Rough translation" rather than presented as reliable.</text></svg>