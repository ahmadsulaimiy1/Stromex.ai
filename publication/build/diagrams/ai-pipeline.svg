<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="450" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — THE AI PIPELINE</text><rect x="0" y="30" width="560" height="300" rx="14" ry="14" fill="#E6FAF6" stroke="#5FE3CE" stroke-width="1.5"/><text x="20" y="54" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#08594E" text-anchor="start" font-weight="700">On device — the default path</text><text x="20" y="70" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Target: over 85 % of all AI invocations. This is the privacy promise made measurable.</text><rect x="20" y="84" width="520" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#5FE3CE" stroke-width="1"/><circle cx="38" cy="105" r="5" fill="#12B39B"/><text x="52" y="102" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Reply suggestions</text><text x="52" y="116" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">drafts only; the user presses send</text><text x="530" y="109" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#0A7466" text-anchor="end" font-weight="400">always local — never a round trip</text><rect x="20" y="131" width="520" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#5FE3CE" stroke-width="1"/><circle cx="38" cy="152" r="5" fill="#12B39B"/><text x="52" y="149" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Tap to translate</text><text x="52" y="163" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">original always shown, never replaced</text><text x="530" y="156" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#0A7466" text-anchor="end" font-weight="400">downloadable language pack</text><rect x="20" y="178" width="520" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#5FE3CE" stroke-width="1"/><circle cx="38" cy="199" r="5" fill="#12B39B"/><text x="52" y="196" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Voice transcription</text><text x="52" y="210" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">sender sees it before sending too</text><text x="530" y="203" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#0A7466" text-anchor="end" font-weight="400">speech model, on device</text><rect x="20" y="225" width="520" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#5FE3CE" stroke-width="1"/><circle cx="38" cy="246" r="5" fill="#12B39B"/><text x="52" y="243" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Semantic search</text><text x="52" y="257" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">covers what is on this device</text><text x="530" y="250" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#0A7466" text-anchor="end" font-weight="400">local embedding index</text><rect x="20" y="272" width="520" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#5FE3CE" stroke-width="1"/><circle cx="38" cy="293" r="5" fill="#12B39B"/><text x="52" y="290" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="600">Scam detection</text><text x="52" y="304" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">content never leaves for this purpose</text><text x="530" y="297" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#0A7466" text-anchor="end" font-weight="400">classifier on incoming messages</text><rect x="580" y="30" width="320" height="138" rx="14" ry="14" fill="#FEF4E6" stroke="#F0C79A" stroke-width="1.5"/><text x="600" y="54" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#B45309" text-anchor="start" font-weight="700">Server — only with a grant</text><text x="600" y="76" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">unread summaries</text><text x="600" y="91" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">higher-quality translation where</text><text x="600" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">   on-device quality is insufficient</text><text x="600" y="121" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">call summaries (every participant consents)</text><text x="600" y="148" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">Shown in the header for the whole time it is active.</text><rect x="580" y="186" width="320" height="144" rx="14" ry="14" fill="#FDECEA" stroke="#E8A9A2" stroke-width="1.5"/><text x="600" y="210" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#C0271B" text-anchor="start" font-weight="700">Never built</text><line x1="600" y1="228" x2="608" y2="228" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">emotion detection on users</text><line x1="600" y1="244" x2="608" y2="244" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="248" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">auto-send without the user pressing send</text><line x1="600" y1="260" x2="608" y2="260" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="264" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">personality simulation of real people</text><line x1="600" y1="276" x2="608" y2="276" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="280" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">engagement optimisation of any kind</text><line x1="600" y1="292" x2="608" y2="292" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="296" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">silent scanning of private conversations</text><line x1="600" y1="308" x2="608" y2="308" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="616" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">a ranking model — there is no feed</text><rect x="0" y="350" width="900" height="90" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="374" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">Non-negotiable properties of every path above</text><text x="20" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Labelled</text><text x="112" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Aurora colour, never a human colour</text><text x="320" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Attributable</text><text x="412" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">you always know a model wrote it</text><text x="620" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Never sends</text><text x="712" y="396" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">drafts only, no exceptions</text><text x="20" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Disableable</text><text x="112" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">one setting, product stays complete</text><text x="320" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Not in the path</text><text x="412" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">0 ms added to send or receive</text><text x="620" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Audited</text><text x="712" y="418" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">zero ungranted invocations, continuously</text></svg>