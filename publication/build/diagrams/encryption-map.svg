<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="520" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — WHERE THE ENCRYPTION PROMISE STARTS AND STOPS</text><rect x="0" y="34" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="53" r="5" fill="#08602F"/><text x="36" y="50" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">1:1 messages</text><text x="36" y="64" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Double Ratchet, per-device sessions</text><rect x="490" y="43" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="57" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="76" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="95" r="5" fill="#08602F"/><text x="36" y="92" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Group messages</text><text x="36" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Sender Keys; rotate on every removal</text><rect x="490" y="85" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="118" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="137" r="5" fill="#08602F"/><text x="36" y="134" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Voice / video 1:1</text><text x="36" y="148" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">DTLS-SRTP, peer-to-peer where possible</text><rect x="490" y="127" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="141" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="160" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="179" r="5" fill="#08602F"/><text x="36" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Group calls</text><text x="36" y="190" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">SFrame — the SFU forwards frames it cannot decrypt</text><rect x="490" y="169" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="183" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="202" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="221" r="5" fill="#08602F"/><text x="36" y="218" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Media files</text><text x="36" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">per-file AES-256-GCM key, carried inside the envelope</text><rect x="490" y="211" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="225" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="244" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="263" r="5" fill="#08602F"/><text x="36" y="260" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Stories</text><text x="36" y="274" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">encrypted to the chosen audience's device keys</text><rect x="490" y="253" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="267" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">End-to-end</text><rect x="0" y="286" width="620" height="38" rx="8" ry="8" fill="#E8F7EE"/><circle cx="20" cy="305" r="5" fill="#08602F"/><text x="36" y="302" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">On-device AI</text><text x="36" y="316" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">translation, transcription, scam detection, search</text><rect x="490" y="295" width="120" height="20" rx="10" ry="10" fill="#08602F"/><text x="550" y="309" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">Never leaves</text><rect x="0" y="328" width="620" height="38" rx="8" ry="8" fill="#FEF4E6"/><circle cx="20" cy="347" r="5" fill="#B45309"/><text x="36" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Channels</text><text x="36" y="358" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">a public broadcast to strangers is not a private conversation</text><rect x="490" y="337" width="120" height="20" rx="10" ry="10" fill="#B45309"/><text x="550" y="351" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">In transit + at rest</text><rect x="0" y="370" width="620" height="38" rx="8" ry="8" fill="#FEF4E6"/><circle cx="20" cy="389" r="5" fill="#B45309"/><text x="36" y="386" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Assistant conversation</text><text x="36" y="400" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">you are talking to a server, and the interface says so</text><rect x="490" y="379" width="120" height="20" rx="10" ry="10" fill="#B45309"/><text x="550" y="393" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">In transit + at rest</text><rect x="0" y="412" width="620" height="38" rx="8" ry="8" fill="#FEF4E6"/><circle cx="20" cy="431" r="5" fill="#B45309"/><text x="36" y="428" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Granted server AI</text><text x="36" y="442" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">explicit, per conversation, revocable, disclosed to all parties</text><rect x="490" y="421" width="120" height="20" rx="10" ry="10" fill="#B45309"/><text x="550" y="435" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">In transit + at rest</text><rect x="650" y="34" width="250" height="210" rx="12" ry="12" fill="#12161E"/><text x="670" y="60" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">What we deliberately</text><text x="670" y="76" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#FFFFFF" text-anchor="start" font-weight="700">did not build</text><text x="686" y="100" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">key escrow</text><line x1="670" y1="96.5" x2="678" y2="96.5" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="686" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">a server-side "recover my</text><text x="686" y="140" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">messages" path</text><line x1="670" y1="124.5" x2="678" y2="124.5" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="686" y="156" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">plaintext cloud backup</text><line x1="670" y1="152.5" x2="678" y2="152.5" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="686" y="184" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">a content-moderation</text><text x="686" y="196" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">pipeline for private chats</text><line x1="670" y1="180.5" x2="678" y2="180.5" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="686" y="212" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">client-side scanning</text><line x1="670" y1="208.5" x2="678" y2="208.5" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="670" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="400">Each is simple to build and</text><rect x="650" y="256" width="250" height="200" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="670" y="280" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">Honest limits</text><text x="670" y="300" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">End-to-end encryption protects content</text><text x="670" y="315" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">in transit and at rest on our servers.</text><text x="670" y="330" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="670" y="345" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">It does not protect against a</text><text x="670" y="360" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">compromised device, a screenshot,</text><text x="670" y="375" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">a malicious participant, or an</text><text x="670" y="390" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">attacker who owns the OS.</text><text x="670" y="405" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400"></text><text x="670" y="420" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">We say this in the product rather</text><text x="670" y="435" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">than let marketing imply otherwise.</text><text x="0" y="476" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">Sender Keys are O(members) on key distribution — which is exactly why groups are capped at 1,000 members at MVP.</text><text x="0" y="494" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">The cap is a published product decision derived from a protocol decision, not an arbitrary limit. MLS lifts it in Phase 3. ADR-003.</text></svg>