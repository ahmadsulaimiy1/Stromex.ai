<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="430" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — DESIGN TOKEN HIERARCHY</text><rect x="0" y="34" width="250" height="92" rx="12" ry="12" fill="#12161E"/><text x="20" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Tier 1 — Primitive</text><text x="20" y="88" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" opacity="0.75">generated, never hand-edited</text><rect x="268" y="34" width="340" height="92" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="286" y="62" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">orbit-500</text><text x="286" y="80" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">void-100</text><text x="286" y="98" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">space-4</text><text x="286" y="116" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">radius-lg</text><text x="286" y="134" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">dur-medium</text><text x="628" y="68" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">Raw values.</text><text x="628" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">Theme-independent. Never referenced by a screen.</text><path d="M125,126 L125,144" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="136" y="140" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">references</text><rect x="0" y="144" width="250" height="92" rx="12" ry="12" fill="#3F5EF0"/><text x="20" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Tier 2 — Semantic</text><text x="20" y="198" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" opacity="0.75">generated, never hand-edited</text><rect x="268" y="144" width="340" height="92" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="286" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">color.surface.primary</text><text x="286" y="190" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">color.text.secondary</text><text x="286" y="208" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">color.action.primary</text><text x="628" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">Meaning, resolved per theme.</text><text x="628" y="196" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">This is the only place light and dark diverge.</text><path d="M125,236 L125,254" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="136" y="250" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">references</text><rect x="0" y="254" width="250" height="92" rx="12" ry="12" fill="#0A7466"/><text x="20" y="286" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="start" font-weight="700">Tier 3 — Component</text><text x="20" y="308" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" opacity="0.75">generated, never hand-edited</text><rect x="268" y="254" width="340" height="92" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="286" y="282" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">bubble.outgoing.background</text><text x="286" y="300" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">composer.height</text><text x="286" y="318" font-family="'JetBrains Mono', monospace" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">button.primary.label</text><text x="628" y="288" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">Component-scoped.</text><text x="628" y="306" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">What screens actually reference.</text><rect x="0" y="366" width="900" height="62" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="20" y="390" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#2438AE" text-anchor="start" font-weight="700">One JSON source → Figma variables · Dart · CSS, generated in CI</text><text x="20" y="412" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Generation is one-directional. Hand-editing a generated file is a build failure — which is what keeps design and code from drifting apart, the failure mode of every design system that dies.</text></svg>