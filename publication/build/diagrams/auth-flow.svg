<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="560" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — IDENTITY, SESSION, AND DEVICE LINKING</text><rect x="0" y="30" width="430" height="240" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="54" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Registration</text><circle cx="34" cy="83" r="10" fill="#3F5EF0"/><text x="34" y="87" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="54" y="80" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Choose a username</text><text x="54" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">@handle, globally unique — identity is not a phone number</text><line x1="34" y1="95" x2="34" y2="105" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="34" cy="121" r="10" fill="#3F5EF0"/><text x="34" y="125" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="54" y="118" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Add a recovery method</text><text x="54" y="132" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">phone or email, optional; if skipped the consequence is stated plainly</text><line x1="34" y1="133" x2="34" y2="143" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="34" cy="159" r="10" fill="#3F5EF0"/><text x="34" y="163" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="54" y="156" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Verify</text><text x="54" y="170" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">rate limited by IP, device attestation, proof-of-work under attack</text><line x1="34" y1="171" x2="34" y2="181" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="34" cy="197" r="10" fill="#3F5EF0"/><text x="34" y="201" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="54" y="194" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Generate keys on device</text><text x="54" y="208" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">identity key, signed prekey, one-time prekeys</text><line x1="34" y1="209" x2="34" y2="219" stroke="#B4BCCB" stroke-width="1.5" stroke-linecap="round"/><circle cx="34" cy="235" r="10" fill="#3F5EF0"/><text x="34" y="239" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="54" y="232" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Publish prekey bundle</text><text x="54" y="246" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">public halves only — the private key never leaves</text><rect x="0" y="288" width="430" height="200" rx="14" ry="14" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Session</text><rect x="20" y="326" width="180" height="50" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="110.0" y="348.46" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="middle" font-weight="600">Device keypair</text><text x="110.0" y="362.96" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="middle" font-weight="400">long-lived, in the platform keystore</text><rect x="214" y="326" width="196" height="50" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="312.0" y="348.46" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="middle" font-weight="600">Access token</text><text x="312.0" y="362.96" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="middle" font-weight="400">15 minutes</text><path d="M200,351 L212,351" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="20" y="388" width="390" height="44" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="215.0" y="407.46" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#2438AE" text-anchor="middle" font-weight="600">Refresh token — rotating, bound to the device key</text><text x="215.0" y="421.96" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="middle" font-weight="400">token theft without the device key is useless</text><text x="20" y="456" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Biometric app lock gates the local database key only. It is not a server-side factor,</text><text x="20" y="470" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">and we do not claim that it is. Passkeys replace SMS wherever the platform allows (Phase 2).</text><rect x="470" y="30" width="430" height="458" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="490" y="54" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Linking a second device</text><text x="490" y="70" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Every device is an independent cryptographic identity. No primary device exists.</text><text x="500" y="96" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="middle" font-weight="700">New device</text><line x1="500" y1="106" x2="500" y2="400" stroke="#D7DDE8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="700" y="96" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="middle" font-weight="700">Existing phone</text><line x1="700" y1="106" x2="700" y2="400" stroke="#D7DDE8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="490" y="112" width="200" height="26" rx="6" ry="6" fill="#EEF2FF"/><text x="500" y="129" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#2438AE" text-anchor="start" font-weight="400">QR code shown, valid 60 s</text><rect x="490" y="150" width="396" height="26" rx="6" ry="6" fill="#F4F6FA"/><text x="500" y="167" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Scan</text><path d="M516,182 L684,182" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="490" y="188" width="396" height="26" rx="6" ry="6" fill="#F4F6FA"/><text x="500" y="205" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Safety number shown on BOTH screens — user confirms they match</text><rect x="490" y="236" width="396" height="26" rx="6" ry="6" fill="#F4F6FA"/><text x="500" y="253" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Choose history: none / 30 days / everything</text><rect x="490" y="274" width="396" height="26" rx="6" ry="6" fill="#F4F6FA"/><text x="500" y="291" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Transfer size shown before it starts</text><rect x="490" y="312" width="396" height="26" rx="6" ry="6" fill="#F4F6FA"/><text x="500" y="329" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Link confirmed</text><rect x="490" y="348" width="396" height="70" rx="10" ry="10" fill="#FEF4E6"/><text x="506" y="370" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">Every existing device is notified — loudly</text><text x="506" y="388" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">and a permanent entry is written to the device log: name, platform, when</text><text x="506" y="402" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">linked, last active, coarse region. Silent device addition is the attack that</text><text x="506" y="416" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">breaks end-to-end encryption for real people. ADR-012.</text></svg>