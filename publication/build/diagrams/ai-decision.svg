<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="470" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — THE AI PRIVACY DECISION, IN PRIORITY ORDER</text><rect x="300" y="32" width="300" height="46" rx="12" ry="12" fill="#12161E" stroke="#12161E" stroke-width="1.5"/><text x="450.0" y="59.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">A new AI capability is proposed</text><path d="M450,78 L450,100" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="230" y="102" width="440" height="58" rx="12" ry="12" fill="#EEF2FF" stroke="#92A7FF" stroke-width="1.5"/><text x="450" y="126" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#2438AE" text-anchor="middle" font-weight="600">Can a model small enough to run on the device do this well?</text><text x="450" y="146" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="middle" font-weight="400">This is the default, and where we invest first</text><path d="M230,131 L120,131 L120,196" fill="none" stroke="#08602F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="126" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#08602F" text-anchor="start" font-weight="700">yes</text><rect x="20" y="198" width="200" height="62" rx="12" ry="12" fill="#E8F7EE" stroke="#9AD0AF" stroke-width="1.5"/><text x="120.0" y="219.32" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#08602F" text-anchor="middle" font-weight="600">Run it on the device</text><text x="120.0" y="234.82" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">plaintext never leaves</text><text x="120.0" y="248.82" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">no grant needed</text><path d="M450,160 L450,186" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="458" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="start" font-weight="700">no</text><rect x="230" y="188" width="440" height="74" rx="12" ry="12" fill="#FEF4E6" stroke="#F0C79A" stroke-width="1.5"/><text x="450" y="212" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="600">Will the user grant server-side processing</text><text x="450" y="230" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="600">for this specific conversation?</text><text x="450" y="250" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">visible in the header · revocable in one tap · disclosed to all participants</text><path d="M670,225 L790,225 L790,286" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="700" y="218" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#B45309" text-anchor="start" font-weight="700">granted</text><rect x="690" y="288" width="210" height="62" rx="12" ry="12" fill="#FEF4E6" stroke="#F0C79A" stroke-width="1.5"/><text x="795.0" y="309.32" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#B45309" text-anchor="middle" font-weight="600">Process on the server</text><text x="795.0" y="324.82" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">for that conversation only</text><text x="795.0" y="338.82" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">deleted within 24 h of revoke</text><path d="M450,262 L450,290" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="458" y="282" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="start" font-weight="700">declined</text><rect x="300" y="292" width="300" height="58" rx="12" ry="12" fill="#FDECEA" stroke="#E8A9A2" stroke-width="1.5"/><text x="450.0" y="318.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#C0271B" text-anchor="middle" font-weight="600">The feature does not ship</text><text x="450.0" y="334.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">there is no third path where we process quietly</text><rect x="0" y="376" width="900" height="88" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="400" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">The assistant conversation is a separate surface with separate rules</text><text x="20" y="420" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">When you talk to the assistant, you are talking to a server. That conversation is encrypted in transit and at rest, retained on a</text><text x="20" y="436" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">published schedule, never used for training without opt-in — and is visibly marked as not end-to-end encrypted. Pretending</text><text x="20" y="452" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#363D4B" text-anchor="start" font-weight="400">otherwise would be the more comfortable lie, and the one thing that would permanently destroy the brand. ADR-005.</text></svg>