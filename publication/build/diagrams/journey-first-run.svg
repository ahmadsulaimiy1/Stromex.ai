<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="400" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — J1: FIRST RUN TO FIRST MESSAGE SENT</text><text x="0" y="34" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">Target: under 90 seconds, four screens. Nothing is requested until it is needed for something the user already wants.</text><rect x="0" y="58" width="116" height="104" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><circle cx="58" cy="80" r="11" fill="#2E48D8"/><text x="58" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="58" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Open</text><text x="58" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">one line of value,</text><text x="58" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">one button</text><text x="58" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">no carousel,</text><text x="58" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">no feature tour</text><path d="M116,110 L128,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="128" y="58" width="116" height="104" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><circle cx="186" cy="80" r="11" fill="#2E48D8"/><text x="186" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="186" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Username</text><text x="186" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">live availability,</text><text x="186" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">suggestions on conflict</text><text x="186" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">identity is not</text><text x="186" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">a phone number</text><path d="M244,110 L256,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="256" y="58" width="116" height="104" rx="10" ry="10" fill="#FEF4E6" stroke="#F0C79A" stroke-width="1.5"/><circle cx="314" cy="80" r="11" fill="#2E48D8"/><text x="314" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="314" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Recovery</text><text x="314" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">phone or email —</text><text x="314" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">optional</text><text x="314" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">if skipped, the</text><text x="314" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">consequence is stated</text><path d="M372,110 L384,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="384" y="58" width="116" height="104" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><circle cx="442" cy="80" r="11" fill="#2E48D8"/><text x="442" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="442" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Name / photo</text><text x="442" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">skippable, and</text><text x="442" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">visibly so</text><text x="442" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">no pressure to</text><text x="442" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">look complete</text><path d="M500,110 L512,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="512" y="58" width="116" height="104" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="570" cy="80" r="11" fill="#2E48D8"/><text x="570" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="570" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Empty Chats</text><text x="570" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">one action:</text><text x="570" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">find someone</text><text x="570" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">QR, link, or</text><text x="570" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">username search</text><path d="M628,110 L640,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="640" y="58" width="116" height="104" rx="10" ry="10" fill="#E8F7EE" stroke="#9AD0AF" stroke-width="1.5"/><circle cx="698" cy="80" r="11" fill="#2E48D8"/><text x="698" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="698" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">First message</text><text x="698" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">the conversation</text><text x="698" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">begins</text><path d="M756,110 L768,110" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="768" y="58" width="116" height="104" rx="10" ry="10" fill="#E8F7EE" stroke="#9AD0AF" stroke-width="1.5"/><circle cx="826" cy="80" r="11" fill="#2E48D8"/><text x="826" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text><text x="826" y="108" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Ask to notify</text><text x="826" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">"so you know</text><text x="826" y="136" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">when they reply"</text><text x="826" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">only now — after</text><text x="826" y="188" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">value, never before</text><rect x="0" y="218" width="440" height="160" rx="12" ry="12" fill="#FDECEA" stroke="#E8A9A2" stroke-width="1.5"/><text x="20" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#C0271B" text-anchor="start" font-weight="700">Where this journey fails</text><text x="20" y="262" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Username taken repeatedly</text><text x="20" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#363D4B" text-anchor="start" font-weight="400">mitigated with genuinely good suggestions</text><text x="20" y="300" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Nobody to talk to</text><text x="20" y="314" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#363D4B" text-anchor="start" font-weight="400">the entire weight of ADR-010 lands here — the empty</text><text x="20" y="326" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#363D4B" text-anchor="start" font-weight="400">state must offer a share link worth sending</text><text x="20" y="348" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Notification permission denied</text><text x="20" y="362" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#363D4B" text-anchor="start" font-weight="400">the app stays fully usable, with a non-nagging</text><text x="20" y="374" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#363D4B" text-anchor="start" font-weight="400">path to reconsider</text><rect x="460" y="218" width="440" height="160" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="480" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">What we measure</text><text x="480" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Completion rate</text><text x="480" y="280" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">per step, so we know which step loses people</text><text x="480" y="292" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Time to first message</text><text x="480" y="306" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">the 90-second target</text><text x="480" y="318" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Share-link send rate</text><text x="480" y="332" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">the proxy for whether ADR-010 is survivable</text><text x="480" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">D1 return</text><text x="480" y="358" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">did the first conversation mean anything</text></svg>