<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="430" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — HOW THE FULL ECOSYSTEM BECAME THIRTEEN FEATURES</text><rect x="0" y="34" width="250" height="120" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="58" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">The founding brief</text><text x="20" y="78" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Every feature of seven competing</text><text x="20" y="92" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">products, plus payments, healthcare,</text><text x="20" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">education, commerce, government</text><text x="20" y="120" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">services and a creator studio.</text><text x="20" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="start" font-weight="700">≈ 90 proposals</text><path d="M250,94 L288,94" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="296" y="34" width="300" height="120" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="316" y="58" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#2438AE" text-anchor="start" font-weight="700">Six questions, asked of each</text><text x="316" y="76" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">1. Which of the three identity pillars does it strengthen?</text><text x="316" y="89" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">2. What is its performance budget?</text><text x="316" y="102" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">3. What is its row in the AI privacy table?</text><text x="316" y="115" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">4. What does it cost users who never use it?</text><text x="316" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">5. Can we build and maintain it at the quality bar?</text><text x="316" y="141" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#363D4B" text-anchor="start" font-weight="400">6. What are we deleting to make room?</text><path d="M596,94 L634,94" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="642" y="34" width="258" height="120" rx="12" ry="12" fill="#E8F7EE" stroke="#9AD0AF" stroke-width="1.5"/><text x="662" y="58" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#08602F" text-anchor="start" font-weight="700">The MVP</text><text x="662" y="78" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Thirteen features, each specified</text><text x="662" y="92" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">to purpose, problem, metrics, UI,</text><text x="662" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">edge cases and failure cases.</text><text x="662" y="142" font-family="'JetBrains Mono', monospace" font-size="11" fill="#08602F" text-anchor="start" font-weight="700">13 features</text><rect x="0" y="190" width="142" height="96" rx="10" ry="10" fill="#E8F7EE"/><text x="71" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#08602F" text-anchor="middle" font-weight="700">13</text><text x="71" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">MVP</text><text x="71" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">Shipped in Phase 1</text><rect x="152" y="190" width="142" height="96" rx="10" ry="10" fill="#EEF2FF"/><text x="223" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#2E48D8" text-anchor="middle" font-weight="700">18</text><text x="223" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Phase 2</text><text x="223" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">Depth, once we know how</text><text x="223" y="267" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">the core is used</text><rect x="304" y="190" width="142" height="96" rx="10" ry="10" fill="#EEF2FF"/><text x="375" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#2E48D8" text-anchor="middle" font-weight="700">16</text><text x="375" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Phase 3</text><text x="375" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">Creator tools and</text><text x="375" y="267" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">protocol maturity</text><rect x="456" y="190" width="142" height="96" rx="10" ry="10" fill="#EEF2FF"/><text x="527" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#2E48D8" text-anchor="middle" font-weight="700">11</text><text x="527" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Phase 4</text><text x="527" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">The business platform</text><rect x="608" y="190" width="142" height="96" rx="10" ry="10" fill="#EEF2FF"/><text x="679" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#2E48D8" text-anchor="middle" font-weight="700">6</text><text x="679" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Phase 5</text><text x="679" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">The ecosystem, last</text><rect x="760" y="190" width="142" height="96" rx="10" ry="10" fill="#FDECEA"/><text x="831" y="222" font-family="Inter, 'Inter Display', sans-serif" font-size="24" fill="#C0271B" text-anchor="middle" font-weight="700">26</text><text x="831" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="middle" font-weight="700">Rejected</text><text x="831" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">Each with a stated</text><text x="831" y="267" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">reason, recorded</text><text x="831" y="278" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#4C5464" text-anchor="middle" font-weight="400">permanently</text><rect x="0" y="306" width="900" height="112" rx="12" ry="12" fill="#12161E"/><text x="24" y="334" font-family="Inter, 'Inter Display', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="start" font-weight="700">Nothing was silently dropped</text><text x="24" y="358" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">Every rejection is recorded with its reasoning, and the counter-argument is written down in advance — because these proposals will come back,</text><text x="24" y="375" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">from a growth team, an investor, or in response to a competitor's launch. A feed. Ads, "just tastefully". Short-form video. Read-your-messages AI.</text><text x="24" y="392" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#B4BCCB" text-anchor="start" font-weight="400">Address-book upload. Streaks. Unlimited free storage. The answers are already written, so they do not have to be re-derived under pressure.</text><text x="24" y="410" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5FE3CE" text-anchor="start" font-weight="700">Part 10 — Scope Governance</text></svg>