<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="490" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — OFFLINE-FIRST SYNCHRONISATION</text><rect x="0" y="30" width="900" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="54" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Outbound — the user says something</text><rect x="20" y="70" width="122" height="96" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="38" cy="90" r="10" fill="#3F5EF0"/><text x="38" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="54" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Compose</text><text x="32" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">draft persisted on</text><text x="32" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">every keystroke pause</text><path d="M142,118 L158,118" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="160" y="70" width="122" height="96" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="178" cy="90" r="10" fill="#3F5EF0"/><text x="178" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="194" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Local write</text><text x="172" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">SQLite first — the</text><text x="172" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">bubble is already on screen</text><path d="M282,118 L298,118" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="300" y="70" width="122" height="96" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="318" cy="90" r="10" fill="#3F5EF0"/><text x="318" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="334" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Outbox row</text><text x="312" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">durable, ordered,</text><text x="312" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">idempotency key attached</text><path d="M422,118 L438,118" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="440" y="70" width="122" height="96" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><circle cx="458" cy="90" r="10" fill="#3F5EF0"/><text x="458" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text><text x="474" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Drain</text><text x="452" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">background worker,</text><text x="452" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">per-conversation order</text><path d="M562,118 L578,118" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="580" y="70" width="122" height="96" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><circle cx="598" cy="90" r="10" fill="#2E48D8"/><text x="598" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text><text x="614" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Server sequence</text><text x="592" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">authoritative order assigned</text><text x="592" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">— never a device clock</text><path d="M702,118 L718,118" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="720" y="70" width="122" height="96" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><circle cx="738" cy="90" r="10" fill="#2E48D8"/><text x="738" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text><text x="754" y="94" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Per-device fan-out</text><text x="732" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">one envelope per</text><text x="732" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">recipient device</text><text x="20" y="190" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2E48D8" text-anchor="start" font-weight="700">50 ms</text><text x="66" y="190" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">budget from send tap to bubble visible — steps 1–3 only; the network is not in this path.</text><text x="20" y="212" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">A failed send blocks only its own conversation. The queue never stalls as a whole.</text><rect x="0" y="250" width="560" height="168" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="274" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Inbound — cursor, gap detection, acknowledgement</text><rect x="20" y="290" width="150" height="46" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="95.0" y="309.96" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="middle" font-weight="600">Per-conversation cursor</text><text x="95.0" y="325.46" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">"everything after N"</text><path d="M170,313 L194,313" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="194" y="290" width="150" height="46" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="269.0" y="309.96" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="middle" font-weight="600">Server streams</text><text x="269.0" y="325.46" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">envelopes in sequence</text><path d="M344,313 L368,313" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="368" y="290" width="172" height="46" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="454.0" y="309.96" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#2438AE" text-anchor="middle" font-weight="600">Decrypt → write → ack</text><text x="454.0" y="325.46" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">the ack is what permits deletion</text><rect x="20" y="348" width="520" height="54" rx="10" ry="10" fill="#FEF4E6"/><text x="36" y="370" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">Sequence gap detected</text><text x="36" y="388" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Automatic retransmit request. An unfillable gap becomes a visible marker in the transcript —</text><text x="36" y="400" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">never an invisible hole. Silent loss is the worst failure mode a messenger has.</text><rect x="580" y="250" width="320" height="168" rx="14" ry="14" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="600" y="274" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">Conflicts resolve by rule, never by asking</text><text x="600" y="294" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Ordering</text><text x="674" y="294" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">server sequence, always</text><text x="600" y="319" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Edits</text><text x="674" y="319" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">last writer wins by device time;</text><text x="674" y="331" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">the loser is kept in edit history</text><text x="600" y="356" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Deletions</text><text x="674" y="356" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">always beat edits</text><text x="600" y="381" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Membership</text><text x="674" y="381" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">server is authoritative</text><text x="600" y="406" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Drafts</text><text x="674" y="406" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">per device — never synced</text><text x="0" y="448" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="start" font-weight="400">The user is never shown a merge dialog. ADR-008.</text></svg>