<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="440" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — SPACING, RADIUS AND ELEVATION</text><text x="0" y="44" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Spacing — a 4 px base unit</text><text x="0" y="60" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">All spacing is a token. An arbitrary value is a lint failure.</text><rect x="0" y="74" width="4" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="0" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-1</text><text x="0" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">4</text><rect x="60" y="74" width="8" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="60" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-2</text><text x="60" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">8</text><rect x="120" y="74" width="12" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="120" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-3</text><text x="120" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">12</text><rect x="180" y="74" width="16" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="180" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-4</text><text x="180" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">16</text><rect x="240" y="74" width="20" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="240" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-5</text><text x="240" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">20</text><rect x="300" y="74" width="24" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="300" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-6</text><text x="300" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">24</text><rect x="360" y="74" width="32" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="360" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-8</text><text x="360" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">32</text><rect x="420" y="74" width="40" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="420" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-10</text><text x="420" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">40</text><rect x="486" y="74" width="48" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="486" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-12</text><text x="486" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">48</text><rect x="560" y="74" width="64" height="40" rx="2" ry="2" fill="#3F5EF0"/><text x="560" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">space-16</text><text x="560" y="140" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#12161E" text-anchor="start" font-weight="700">64</text><text x="0" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Radius — one geometric family, so the product feels cut from one material</text><rect x="0" y="194" width="120" height="68" rx="4" ry="4" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="60" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-xs</text><text x="60" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">4 px</text><text x="60" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">tags, inline code</text><rect x="148" y="194" width="120" height="68" rx="8" ry="8" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="208" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-sm</text><text x="208" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">8 px</text><text x="208" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">inputs, buttons</text><rect x="296" y="194" width="120" height="68" rx="12" ry="12" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="356" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-md</text><text x="356" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">12 px</text><text x="356" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">cards, media</text><rect x="444" y="194" width="120" height="68" rx="18" ry="18" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="504" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-lg</text><text x="504" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">18 px</text><text x="504" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">message bubbles</text><rect x="592" y="194" width="120" height="68" rx="24" ry="24" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="652" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-xl</text><text x="652" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">24 px</text><text x="652" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">sheets, dialogs</text><rect x="740" y="194" width="120" height="68" rx="34" ry="34" fill="#F4F6FA" stroke="#6681FB" stroke-width="1.5"/><text x="800" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="middle" font-weight="700">radius-full</text><text x="800" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">999 px</text><text x="800" y="276" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="middle" font-weight="400">avatars, pills</text><text x="0" y="314" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Elevation — six levels; in dark mode elevation is expressed by lightness, not shadow</text><rect x="4" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.0"/><rect x="0" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="65" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e0</text><text x="65" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">flat content, bubbles</text><rect x="152" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.55"/><rect x="148" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="213" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e1</text><text x="213" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">cards, list rows</text><rect x="300" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.55"/><rect x="296" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="361" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e2</text><text x="361" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">composer, sticky headers</text><rect x="448" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.55"/><rect x="444" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="509" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e3</text><text x="509" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">sheets, menus</text><rect x="596" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.55"/><rect x="592" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="657" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e4</text><text x="657" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">dialogs</text><rect x="744" y="336" width="130" height="54" rx="10" ry="10" fill="#E9EDF4" opacity="0.55"/><rect x="740" y="332" width="130" height="54" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><text x="805" y="356" font-family="'JetBrains Mono', monospace" font-size="11" fill="#12161E" text-anchor="middle" font-weight="700">e5</text><text x="805" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#4C5464" text-anchor="middle" font-weight="400">incoming call</text><text x="0" y="410" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">Message bubbles cast no shadow — they are content, not objects. A transcript with 200 shadowed bubbles is 200 unnecessary composited layers.</text></svg>