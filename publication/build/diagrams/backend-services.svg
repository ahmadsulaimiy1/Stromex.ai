<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="500" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — BACKEND SERVICES AND THEIR SCALING TRIGGERS</text><rect x="0" y="30" width="210" height="200" rx="12" ry="12" fill="#3F5EF0" stroke="#2E48D8" stroke-width="1.5"/><text x="16" y="56" font-family="'JetBrains Mono', monospace" font-size="15" fill="#FFFFFF" text-anchor="start" font-weight="700">gateway</text><line x1="16" y1="66" x2="194" y2="66" stroke="#92A7FF" stroke-width="1" stroke-linecap="round"/><circle cx="20" cy="80.5" r="2" fill="#DDE4FF"/><text x="30" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#EEF2FF" text-anchor="start" font-weight="400">WebSocket termination</text><circle cx="20" cy="100.5" r="2" fill="#DDE4FF"/><text x="30" y="104" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#EEF2FF" text-anchor="start" font-weight="400">authentication</text><circle cx="20" cy="120.5" r="2" fill="#DDE4FF"/><text x="30" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#EEF2FF" text-anchor="start" font-weight="400">connection state</text><circle cx="20" cy="140.5" r="2" fill="#DDE4FF"/><text x="30" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#EEF2FF" text-anchor="start" font-weight="400">per-socket rate limit</text><circle cx="20" cy="160.5" r="2" fill="#DDE4FF"/><text x="30" y="164" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#EEF2FF" text-anchor="start" font-weight="400">fan-out to devices</text><text x="16" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#DDE4FF" text-anchor="start" font-weight="600">Stateful — holds sockets</text><rect x="0" y="244" width="210" height="96" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="16" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">SCALING TRIGGER</text><text x="16" y="284" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">&gt;150 K concurrent sockets</text><text x="16" y="298" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">→ add instances, shard by</text><text x="16" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">   consistent hash on user ID</text><rect x="230" y="30" width="210" height="200" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="246" y="56" font-family="'JetBrains Mono', monospace" font-size="15" fill="#12161E" text-anchor="start" font-weight="700">core</text><line x1="246" y1="66" x2="424" y2="66" stroke="#D7DDE8" stroke-width="1" stroke-linecap="round"/><circle cx="250" cy="80.5" r="2" fill="#676F80"/><text x="260" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">accounts · devices</text><circle cx="250" cy="100.5" r="2" fill="#676F80"/><text x="260" y="104" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">conversations · groups</text><circle cx="250" cy="120.5" r="2" fill="#676F80"/><text x="260" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">channels · profiles</text><circle cx="250" cy="140.5" r="2" fill="#676F80"/><text x="260" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">message envelopes</text><circle cx="250" cy="160.5" r="2" fill="#676F80"/><text x="260" y="164" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">prekey bundles</text><text x="246" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="600">Stateless — scales flat</text><rect x="230" y="244" width="210" height="96" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="246" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">SCALING TRIGGER</text><text x="246" y="284" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Write CPU &gt; 60 %</text><text x="246" y="298" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">→ read replicas, then</text><text x="246" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">   partition by user-ID range</text><rect x="460" y="30" width="210" height="200" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="476" y="56" font-family="'JetBrains Mono', monospace" font-size="15" fill="#12161E" text-anchor="start" font-weight="700">media</text><line x1="476" y1="66" x2="654" y2="66" stroke="#D7DDE8" stroke-width="1" stroke-linecap="round"/><circle cx="480" cy="80.5" r="2" fill="#676F80"/><text x="490" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">upload orchestration</text><circle cx="480" cy="100.5" r="2" fill="#676F80"/><text x="490" y="104" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">presigned URLs</text><circle cx="480" cy="120.5" r="2" fill="#676F80"/><text x="490" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">resumable transfers</text><circle cx="480" cy="140.5" r="2" fill="#676F80"/><text x="490" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">retention enforcement</text><circle cx="480" cy="160.5" r="2" fill="#676F80"/><text x="490" y="164" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">ciphertext only</text><text x="476" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="600">Stateless — scales flat</text><rect x="460" y="244" width="210" height="96" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="476" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">SCALING TRIGGER</text><text x="476" y="284" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Egress cost per user</text><text x="476" y="298" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">→ CDN tiering and</text><text x="476" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">   longer edge TTLs</text><rect x="690" y="30" width="210" height="200" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="706" y="56" font-family="'JetBrains Mono', monospace" font-size="15" fill="#12161E" text-anchor="start" font-weight="700">push</text><line x1="706" y1="66" x2="884" y2="66" stroke="#D7DDE8" stroke-width="1" stroke-linecap="round"/><circle cx="710" cy="80.5" r="2" fill="#676F80"/><text x="720" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">APNs + FCM dispatch</text><circle cx="710" cy="100.5" r="2" fill="#676F80"/><text x="720" y="104" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">token lifecycle</text><circle cx="710" cy="120.5" r="2" fill="#676F80"/><text x="720" y="124" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">content-free envelopes</text><circle cx="710" cy="140.5" r="2" fill="#676F80"/><text x="720" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">priority selection</text><circle cx="710" cy="160.5" r="2" fill="#676F80"/><text x="720" y="164" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="400">invalid-token pruning</text><text x="706" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="600">Queue-driven</text><rect x="690" y="244" width="210" height="96" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="706" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">SCALING TRIGGER</text><text x="706" y="284" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Dispatch backlog</text><text x="706" y="298" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">→ scale workers; push is</text><text x="706" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">   never in the send path</text><rect x="0" y="362" width="900" height="118" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="20" y="388" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#2438AE" text-anchor="start" font-weight="700">Why a modular monolith and not microservices</text><text x="20" y="412" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#363D4B" text-anchor="start" font-weight="400">Module boundaries inside core are enforced by an import linter from day one, so extracting a module later is a mechanical change.</text><text x="20" y="431" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#363D4B" text-anchor="start" font-weight="400">We take on the boundary discipline immediately and the deployment complexity only when a module's scaling profile actually diverges.</text><text x="20" y="450" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#363D4B" text-anchor="start" font-weight="400">A five-person backend team split across twelve services spends its time on distributed-systems debugging rather than on the product.</text><text x="20" y="470" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#2E48D8" text-anchor="start" font-weight="700">ADR-002</text></svg>