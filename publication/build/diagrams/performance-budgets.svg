<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="440" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — PERFORMANCE BUDGETS, BY DEVICE TIER</text><text x="0" y="34" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">Tier C is the design target, not the fallback. Any screen that only feels good on Tier A is unfinished.</text><rect x="636" y="56" width="264" height="36" rx="8" ry="8" fill="#F4F6FA"/><rect x="636" y="56" width="6" height="36" rx="3" ry="3" fill="#92A7FF"/><text x="654" y="72" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Tier A</text><text x="706" y="72" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">flagship, ≤ 2 years</text><text x="654" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">~15 % of market</text><rect x="636" y="98" width="264" height="36" rx="8" ry="8" fill="#F4F6FA"/><rect x="636" y="98" width="6" height="36" rx="3" ry="3" fill="#3F5EF0"/><text x="654" y="114" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Tier B</text><text x="706" y="114" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">mainstream, 2–4 years</text><text x="654" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">~50 % of market</text><rect x="636" y="140" width="264" height="36" rx="8" ry="8" fill="#F4F6FA"/><rect x="636" y="140" width="6" height="36" rx="3" ry="3" fill="#1E2F8A"/><text x="654" y="156" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#12161E" text-anchor="start" font-weight="700">Tier C</text><text x="706" y="156" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">entry-level, low RAM</text><text x="654" y="170" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">~35 % of market</text><text x="0" y="72" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#232935" text-anchor="start" font-weight="400">Cold launch to interactive</text><rect x="250" y="60" width="108.0" height="7" rx="3.5" ry="3.5" fill="#92A7FF"/><rect x="250" y="69" width="192.0" height="7" rx="3.5" ry="3.5" fill="#3F5EF0"/><rect x="250" y="78" width="360.0" height="7" rx="3.5" ry="3.5" fill="#1E2F8A"/><text x="618.0" y="86" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">450 / 800 / 1500 ms</text><text x="0" y="118" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#232935" text-anchor="start" font-weight="400">Touch → first visual response</text><rect x="250" y="106" width="24.0" height="7" rx="3.5" ry="3.5" fill="#92A7FF"/><rect x="250" y="115" width="24.0" height="7" rx="3.5" ry="3.5" fill="#3F5EF0"/><rect x="250" y="124" width="24.0" height="7" rx="3.5" ry="3.5" fill="#1E2F8A"/><text x="282.0" y="132" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">100 / 100 / 100 ms</text><text x="0" y="164" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#232935" text-anchor="start" font-weight="400">Send tap → bubble visible</text><rect x="250" y="152" width="12.0" height="7" rx="3.5" ry="3.5" fill="#92A7FF"/><rect x="250" y="161" width="12.0" height="7" rx="3.5" ry="3.5" fill="#3F5EF0"/><rect x="250" y="170" width="12.0" height="7" rx="3.5" ry="3.5" fill="#1E2F8A"/><text x="270.0" y="178" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">50 / 50 / 50 ms</text><text x="0" y="210" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#232935" text-anchor="start" font-weight="400">Search keystroke → results</text><rect x="250" y="198" width="12.0" height="7" rx="3.5" ry="3.5" fill="#92A7FF"/><rect x="250" y="207" width="12.0" height="7" rx="3.5" ry="3.5" fill="#3F5EF0"/><rect x="250" y="216" width="12.0" height="7" rx="3.5" ry="3.5" fill="#1E2F8A"/><text x="270.0" y="224" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">50 / 50 / 50 ms</text><text x="0" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#232935" text-anchor="start" font-weight="400">Send → delivered (p95)</text><rect x="250" y="244" width="168.0" height="7" rx="3.5" ry="3.5" fill="#92A7FF"/><rect x="250" y="253" width="168.0" height="7" rx="3.5" ry="3.5" fill="#3F5EF0"/><rect x="250" y="262" width="168.0" height="7" rx="3.5" ry="3.5" fill="#1E2F8A"/><text x="426.0" y="270" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4C5464" text-anchor="start" font-weight="400">700 / 700 / 700 ms</text><text x="0" y="296" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="700">Memory ceilings (MB) — stricter on weaker hardware, not looser</text><text x="0" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">Low-memory Android kills background apps aggressively. A large footprint turns every warm launch into a cold one.</text><rect x="0" y="326" width="190" height="76" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="14" y="348" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Idle</text><text x="14" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">A</text><text x="14" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2E48D8" text-anchor="start" font-weight="700">120</text><text x="74" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">B</text><text x="74" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2438AE" text-anchor="start" font-weight="700">100</text><text x="134" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">C</text><text x="134" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1E2F8A" text-anchor="start" font-weight="700">80</text><rect x="204" y="326" width="190" height="76" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="218" y="348" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Active + media</text><text x="218" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">A</text><text x="218" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2E48D8" text-anchor="start" font-weight="700">220</text><text x="278" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">B</text><text x="278" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2438AE" text-anchor="start" font-weight="700">180</text><text x="338" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">C</text><text x="338" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1E2F8A" text-anchor="start" font-weight="700">140</text><rect x="408" y="326" width="190" height="76" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="422" y="348" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#12161E" text-anchor="start" font-weight="700">Peak, any operation</text><text x="422" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">A</text><text x="422" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2E48D8" text-anchor="start" font-weight="700">400</text><text x="482" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">B</text><text x="482" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2438AE" text-anchor="start" font-weight="700">350</text><text x="542" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">C</text><text x="542" y="388" font-family="'JetBrains Mono', monospace" font-size="13" fill="#1E2F8A" text-anchor="start" font-weight="700">260</text><rect x="624" y="326" width="276" height="76" rx="10" ry="10" fill="#12161E"/><text x="640" y="348" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="start" font-weight="700">The budget process</text><text x="640" y="366" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#B4BCCB" text-anchor="start" font-weight="400">Measured in CI on physical hardware,</text><text x="640" y="379" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#B4BCCB" text-anchor="start" font-weight="400">per pull request, per tier. A regression</text><text x="640" y="392" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#B4BCCB" text-anchor="start" font-weight="400">fails the build — not a warning, a ticket.</text><text x="0" y="424" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">Exceeding a budget requires an explicit trade: something else gives up an equivalent amount, recorded in the pull request. Budgets do not inflate quietly.</text></svg>