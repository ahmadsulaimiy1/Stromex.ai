<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="660" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — SYSTEM ARCHITECTURE</text><rect x="0" y="30" width="400" height="250" rx="14" ry="14" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5" stroke-dasharray="5 4"/><text x="16" y="52" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#2438AE" text-anchor="start" font-weight="700">The device</text><text x="16" y="68" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="400">Source of truth for everything on screen</text><rect x="16" y="80" width="178" height="46" rx="12" ry="12" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1.5"/><text x="105.0" y="100.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Flutter UI</text><text x="105.0" y="116.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">presentation · application</text><rect x="206" y="80" width="178" height="46" rx="12" ry="12" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1.5"/><text x="295.0" y="100.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Domain logic</text><text x="295.0" y="116.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">pure Dart, no framework</text><rect x="16" y="136" width="118" height="58" rx="12" ry="12" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1.5"/><text x="75.0" y="155.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">SQLite</text><text x="75.0" y="171.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">Drift + SQLCipher</text><text x="75.0" y="185.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">messages · index</text><rect x="142" y="136" width="118" height="58" rx="12" ry="12" fill="#FFFFFF" stroke="#BCC9FF" stroke-width="1.5"/><text x="201.0" y="155.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">libsignal</text><text x="201.0" y="171.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">Rust via FFI</text><text x="201.0" y="185.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">X3DH · ratchet</text><rect x="268" y="136" width="116" height="58" rx="12" ry="12" fill="#E6FAF6" stroke="#5FE3CE" stroke-width="1.5"/><text x="326.0" y="155.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#08594E" text-anchor="middle" font-weight="600">On-device AI</text><text x="326.0" y="171.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#0A7466" text-anchor="middle" font-weight="400">translate · ASR</text><text x="326.0" y="185.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#0A7466" text-anchor="middle" font-weight="400">scam · search</text><rect x="16" y="204" width="368" height="40" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="200.0" y="221.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Outbox</text><text x="200.0" y="237.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">durable, ordered, idempotent — drains when the network returns</text><text x="200" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#2438AE" text-anchor="middle" font-weight="600">Plaintext never leaves this boundary unless the user grants it (ADR-005)</text><path d="M200,280 L200,316" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><text x="212" y="302" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="400">TLS 1.3 · pinned · protobuf over one WebSocket</text><rect x="0" y="320" width="400" height="44" rx="12" ry="12" fill="#3F5EF0" stroke="#2E48D8" stroke-width="1.5"/><text x="200.0" y="339.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Gateway (Go)</text><text x="200.0" y="355.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#DDE4FF" text-anchor="middle" font-weight="400">socket termination · auth · rate limit · fan-out</text><rect x="0" y="386" width="400" height="128" rx="14" ry="14" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="16" y="408" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#363D4B" text-anchor="start" font-weight="600">Services — a modular monolith, four deployables (ADR-002)</text><rect x="16" y="420" width="118" height="76" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="75.0" y="441.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">core</text><text x="75.0" y="457.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">accounts · groups</text><text x="75.0" y="471.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">conversations</text><text x="75.0" y="485.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">channels</text><rect x="142" y="420" width="118" height="76" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="201.0" y="448.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">media</text><text x="201.0" y="464.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">presigned URLs</text><text x="201.0" y="478.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">ciphertext only</text><rect x="268" y="420" width="116" height="76" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="326.0" y="448.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">push</text><text x="326.0" y="464.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">APNs · FCM</text><text x="326.0" y="478.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">no content</text><rect x="0" y="536" width="400" height="106" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="16" y="558" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#363D4B" text-anchor="start" font-weight="600">State</text><rect x="16" y="568" width="118" height="58" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="75.0" y="587.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">PostgreSQL</text><text x="75.0" y="603.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">accounts · envelopes</text><text x="75.0" y="617.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">partitioned</text><rect x="142" y="568" width="118" height="58" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="201.0" y="587.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Redis</text><text x="201.0" y="603.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">presence · limits</text><text x="201.0" y="617.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">ephemeral</text><rect x="268" y="568" width="116" height="58" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="326.0" y="587.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Object store</text><text x="326.0" y="603.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">media ciphertext</text><text x="326.0" y="617.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">+ CDN</text><path d="M200,364 L200,384" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><path d="M200,514 L200,534" fill="none" stroke="#8B94A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="440" y="30" width="460" height="250" rx="14" ry="14" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="456" y="52" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">Real-time media</text><text x="456" y="68" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="400">Signalling rides the same WebSocket — no second stack</text><rect x="456" y="80" width="200" height="52" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="556.0" y="96.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">1:1 call</text><text x="556.0" y="112.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">peer-to-peer first (ICE/STUN)</text><text x="556.0" y="126.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">DTLS-SRTP end to end</text><rect x="672" y="80" width="212" height="52" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="778.0" y="103.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">TURN relay</text><text x="778.0" y="119.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">only when NAT traversal fails</text><rect x="456" y="144" width="428" height="60" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="670.0" y="164.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#2438AE" text-anchor="middle" font-weight="600">LiveKit SFU — group calls</text><text x="670.0" y="180.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#4C5464" text-anchor="middle" font-weight="400">insertable-stream E2EE (SFrame): the SFU forwards frames it cannot decrypt</text><text x="670.0" y="194.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#4C5464" text-anchor="middle" font-weight="400">an MCU is rejected — server-side mixing means server-side plaintext</text><rect x="456" y="216" width="428" height="44" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="670.0" y="235.5" font-family="Inter, 'Inter Display', sans-serif" font-size="12.5" fill="#12161E" text-anchor="middle" font-weight="600">Audio priority allocator</text><text x="670.0" y="251.0" font-family="Inter, 'Inter Display', sans-serif" font-size="10.5" fill="#676F80" text-anchor="middle" font-weight="400">audio takes its floor first; video receives only the remainder</text><rect x="440" y="320" width="460" height="330" rx="14" ry="14" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="456" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="12" fill="#12161E" text-anchor="start" font-weight="700">What the server holds</text><rect x="456" y="356" width="428" height="40" rx="8" ry="8" fill="#FEF4E6"/><circle cx="474" cy="376" r="5.5" fill="#B45309"/><text x="490" y="373" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Routing metadata</text><text x="490" y="387" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">who talked to whom, when, message size</text><rect x="456" y="400" width="428" height="40" rx="8" ry="8" fill="#FEF4E6"/><circle cx="474" cy="420" r="5.5" fill="#B45309"/><text x="490" y="417" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Undelivered envelopes</text><text x="490" y="431" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">ciphertext only — deleted on delivery, or at 30 days</text><rect x="456" y="444" width="428" height="40" rx="8" ry="8" fill="#E8F7EE"/><circle cx="474" cy="464" r="5.5" fill="#08602F"/><text x="490" y="461" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Delivered envelopes</text><text x="490" y="475" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">not stored at all; the server is a relay, not an archive</text><rect x="456" y="488" width="428" height="40" rx="8" ry="8" fill="#E8F7EE"/><circle cx="474" cy="508" r="5.5" fill="#08602F"/><text x="490" y="505" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Message content</text><text x="490" y="519" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">no key exists server-side to read it</text><rect x="456" y="532" width="428" height="40" rx="8" ry="8" fill="#E8F7EE"/><circle cx="474" cy="552" r="5.5" fill="#08602F"/><text x="490" y="549" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Media</text><text x="490" y="563" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">client-encrypted per file; the store holds ciphertext</text><rect x="456" y="576" width="428" height="40" rx="8" ry="8" fill="#E8F7EE"/><circle cx="474" cy="596" r="5.5" fill="#08602F"/><text x="490" y="593" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="600">Search index</text><text x="490" y="607" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">none — the only index is on the device</text><text x="456" y="634" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#676F80" text-anchor="start" font-weight="400">Green — cannot be read, even by us.   Amber — necessarily processed in order to route.</text></svg>