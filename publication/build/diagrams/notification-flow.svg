<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="400" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — A NOTIFICATION THAT THE SERVER CANNOT READ</text><rect x="0" y="40" width="132" height="96" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="66" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="700">Sender</text><text x="66" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">encrypts for each</text><text x="66" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">recipient device</text><path d="M132,88 L152,88" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="152" y="40" width="132" height="96" rx="10" ry="10" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="218" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="700">Server</text><text x="218" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">stores the envelope,</text><text x="218" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">cannot decrypt it</text><path d="M284,88 L304,88" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="304" y="40" width="132" height="96" rx="10" ry="10" fill="#FEF4E6" stroke="#F0C79A" stroke-width="1.5"/><text x="370" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="700">APNs / FCM</text><text x="370" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">carries only:</text><text x="370" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">envelope id, conv hash,</text><text x="370" y="112" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">priority</text><path d="M436,88 L456,88" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="456" y="40" width="132" height="96" rx="10" ry="10" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="522" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="700">Device wakes</text><text x="522" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">notification service</text><text x="522" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">extension, 24 MB limit</text><path d="M588,88 L608,88" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="608" y="40" width="132" height="96" rx="10" ry="10" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="674" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#2438AE" text-anchor="middle" font-weight="700">Fetch + decrypt</text><text x="674" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">locally, on device</text><path d="M740,88 L760,88" fill="none" stroke="#2E48D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/><rect x="760" y="40" width="132" height="96" rx="10" ry="10" fill="#E8F7EE" stroke="#9AD0AF" stroke-width="1.5"/><text x="826" y="66" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="middle" font-weight="700">Notification text</text><text x="826" y="86" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">built on the device</text><text x="826" y="99" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">from plaintext</text><rect x="0" y="158" width="440" height="100" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="182" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">The payload, in full</text><rect x="20" y="194" width="400" height="46" rx="8" ry="8" fill="#12161E"/><text x="36" y="214" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5FE3CE" text-anchor="start" font-weight="400">{ envelope_id, conversation_id_hash, priority }</text><text x="36" y="230" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="400">no sender name, no preview, no content</text><rect x="460" y="158" width="440" height="100" rx="12" ry="12" fill="#EEF2FF" stroke="#BCC9FF" stroke-width="1.5"/><text x="480" y="182" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#2438AE" text-anchor="start" font-weight="700">Why it is built this way</text><text x="480" y="202" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">The simplest implementation puts the message text in the payload —</text><text x="480" y="216" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">and hands the most-read text in the product to Apple and Google.</text><text x="480" y="236" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">If the fetch fails we show "New message" rather than nothing. ADR-007.</text><rect x="0" y="280" width="900" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="304" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">What may notify a user</text><circle cx="30" cy="324" r="4" fill="#08602F"/><text x="42" y="328" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">a message addressed to you</text><circle cx="30" cy="339" r="4" fill="#08602F"/><text x="42" y="343" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">an incoming call</text><circle cx="30" cy="354" r="4" fill="#08602F"/><text x="42" y="358" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">a security event on your account</text><circle cx="30" cy="369" r="4" fill="#08602F"/><text x="42" y="373" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">a completion you asked to be told about</text><text x="480" y="304" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#C0271B" text-anchor="start" font-weight="700">What may never notify a user</text><line x1="486" y1="324" x2="494" y2="324" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="502" y="328" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">re-engagement prompts</text><line x1="486" y1="339" x2="494" y2="339" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="502" y="343" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">"you have unread messages"</text><line x1="486" y1="354" x2="494" y2="354" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="502" y="358" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">feature announcements, tips</text><line x1="486" y1="369" x2="494" y2="369" stroke="#C0271B" stroke-width="2" stroke-linecap="round"/><text x="502" y="373" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">streaks, birthdays, "friend is active"</text></svg>