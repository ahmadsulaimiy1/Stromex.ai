<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="440" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — THUMB REACH AND ONE-HANDED USE</text><rect x="40" y="34" width="190" height="380" rx="26" ry="26" fill="#FFFFFF" stroke="#B4BCCB" stroke-width="2"/><rect x="46" y="40" width="178" height="95.0" rx="20" ry="20" fill="#FDECEA"/><rect x="46" y="135.0" width="178" height="133.0" rx="4" ry="4" fill="#FEF4E6"/><rect x="46" y="268.0" width="178" height="140.0" rx="20" ry="20" fill="#E8F7EE"/><text x="135.0" y="83.4" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#C0271B" text-anchor="middle" font-weight="700">HARD</text><text x="135.0" y="103.1" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">top 25 %</text><text x="135.0" y="193.6" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">STRETCH</text><text x="135.0" y="207.6" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">middle 35 %</text><text x="135.0" y="338.0" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#08602F" text-anchor="middle" font-weight="700">NATURAL</text><text x="135.0" y="352.0" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="middle" font-weight="400">bottom 40 %</text><path d="M216,398 Q50,374 56,193.6" fill="none" stroke="#3F5EF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="40" y="438" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">Thumb arc, right hand, 6.1–6.9″ device</text><rect x="270" y="34" width="300" height="110" rx="10" ry="10" fill="#E8F7EE"/><text x="288" y="56" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#08602F" text-anchor="start" font-weight="700">Natural — bottom 40 %</text><text x="288" y="74" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">composer, send, mic</text><text x="288" y="90" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">tab bar</text><text x="288" y="106" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">answer / end call</text><text x="288" y="122" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">sheet actions</text><text x="288" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">reply, react</text><rect x="270" y="156" width="300" height="78" rx="10" ry="10" fill="#FEF4E6"/><text x="288" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">Stretch — middle 35 %</text><text x="288" y="196" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">message content</text><text x="288" y="212" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">list rows — large targets,</text><text x="288" y="228" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">   tap anywhere in the row</text><rect x="270" y="246" width="300" height="94" rx="10" ry="10" fill="#FDECEA"/><text x="288" y="268" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#C0271B" text-anchor="start" font-weight="700">Hard — top 25 %</text><text x="288" y="286" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">screen titles</text><text x="288" y="302" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">back (also served by the</text><text x="288" y="318" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">   edge-swipe gesture)</text><text x="288" y="334" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">secondary actions</text><rect x="600" y="34" width="300" height="380" rx="12" ry="12" fill="#F4F6FA" stroke="#D7DDE8" stroke-width="1.5"/><text x="620" y="58" font-family="Inter, 'Inter Display', sans-serif" font-size="11.5" fill="#12161E" text-anchor="start" font-weight="700">Rules that follow</text><text x="620" y="80" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Every high-frequency action is in the natural</text><text x="620" y="96" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">zone. Send, record, react, reply, answer and</text><text x="620" y="112" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">end call are all reachable without regrip.</text><text x="620" y="128" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="620" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Destructive actions are never in the natural</text><text x="620" y="160" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">zone. Delete and block live in menus,</text><text x="620" y="176" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">deliberately requiring intent.</text><text x="620" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="620" y="208" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Sheets over dialogs. A bottom sheet puts its</text><text x="620" y="224" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">actions where the thumb is; a centred dialog</text><text x="620" y="240" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">puts them where it is not.</text><text x="620" y="256" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="620" y="272" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Primary actions sit bottom-right in LTR and</text><text x="620" y="288" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">bottom-left in RTL, mirroring with the layout.</text><text x="620" y="304" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400"></text><text x="620" y="320" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">Every new screen is reviewed on a 6.7″ device,</text><text x="620" y="336" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">held in one hand, by someone who is not the</text><text x="620" y="352" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">designer. If a common task needs a regrip,</text><text x="620" y="368" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="400">it is not done.</text></svg>