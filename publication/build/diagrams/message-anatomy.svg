<svg xmlns="http://www.w3.org/2000/svg" width="900" height="502" viewBox="0 0 900 502"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#8B94A6"/></marker><marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1.6 L9,5 L0,8.4 z" fill="#2E48D8"/></marker></defs><rect width="900" height="502" fill="#FFFFFF"/><text x="0" y="12" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#8B94A6" text-anchor="start" font-weight="600" letter-spacing="1.1">FIGURE — ANATOMY OF THE MESSAGE BUBBLE</text><text x="0" y="34" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#4C5464" text-anchor="start" font-weight="400">The most important component in the product. Everything else is held to a lower ambition ceiling.</text><rect x="0" y="52" width="420" height="386" rx="14" ry="14" fill="#FAFBFD" stroke="#D7DDE8" stroke-width="1.5"/><text x="20" y="76" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#676F80" text-anchor="start" font-weight="700">Light mode</text><path d="M38,88 H218 A18,18 0 0 1 236,106 V106 A18,18 0 0 1 218,124 H38 A18,18 0 0 1 20,106 V106 A18,18 0 0 1 38,88 Z" fill="#E9EDF4"/><text x="34" y="111" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">Are we still on for Thursday?</text><path d="M38,126 H160 A18,18 0 0 1 178,144 V144 A18,18 0 0 1 160,162 H38 A18,18 0 0 1 20,144 V144 A18,18 0 0 1 38,126 Z" fill="#E9EDF4"/><text x="34" y="149" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">Same place as before</text><path d="M38,164 H124 A18,18 0 0 1 142,182 V182 A18,18 0 0 1 124,200 H24 A4,4 0 0 1 20,196 V182 A18,18 0 0 1 38,164 Z" fill="#E9EDF4"/><text x="34" y="187" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">Let me know</text><text x="20" y="216" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">09:14</text><line x1="150" y1="182" x2="176" y2="182" stroke="#3F5EF0" stroke-width="1.2" stroke-linecap="round"/><text x="180" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#2E48D8" text-anchor="start" font-weight="400">radius-xs 4 px,</text><text x="180" y="189" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#2E48D8" text-anchor="start" font-weight="400">last in run only</text><path d="M196,246 H376 A18,18 0 0 1 394,264 V278 A4,4 0 0 1 390,282 H196 A18,18 0 0 1 178,264 V264 A18,18 0 0 1 196,246 Z" fill="#DDE4FF"/><text x="192" y="269" font-family="Inter, 'Inter Display', sans-serif" font-size="11" fill="#12161E" text-anchor="start" font-weight="400">Thursday works. 7pm?</text><rect x="214" y="288" width="46" height="22" rx="11" ry="11" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/><path d="M228,304.5 C220.2,298.5 224.7,293.1 228,297.9 C231.3,293.1 235.8,298.5 228,304.5 Z" fill="#C0271B"/><text x="244" y="304" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="middle" font-weight="400">2</text><text x="300" y="302" font-family="Inter, 'Inter Display', sans-serif" font-size="8.5" fill="#676F80" text-anchor="start" font-weight="400">09:16</text><path d="M338,298 l4,4 l9,-10" fill="none" stroke="#2E48D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,298 l4,4 l9,-10" fill="none" stroke="#2E48D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="302" font-family="Inter, 'Inter Display', sans-serif" font-size="8" fill="#676F80" text-anchor="start" font-weight="400">read</text><text x="20" y="344" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#363D4B" text-anchor="start" font-weight="600">Consecutive messages within 60 s form a run:</text><text x="20" y="360" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">spacing tightens to 2 px, and only the last bubble takes the small</text><text x="20" y="374" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">corner nearest the sender's edge. This is the single most important</text><text x="20" y="388" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">detail in the transcript's visual rhythm — and the reason a burst of</text><text x="20" y="402" font-family="Inter, 'Inter Display', sans-serif" font-size="9.5" fill="#4C5464" text-anchor="start" font-weight="400">messages reads as one utterance rather than four interruptions.</text><text x="20" y="424" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#676F80" text-anchor="start" font-weight="400">Delivery states differ in glyph geometry, never in colour alone.</text><rect x="440" y="52" width="460" height="54" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="70" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Radius</text><text x="456" y="84" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">radius-lg 18 px on three corners; radius-xs 4 px on the corner</text><text x="456" y="96" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">nearest the sender — last in run only</text><rect x="440" y="112" width="460" height="42" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="130" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Incoming fill</text><text x="456" y="144" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">void-100 #E9EDF4 · text void-900 at 15.43 : 1</text><rect x="440" y="160" width="460" height="54" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="178" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Outgoing fill</text><text x="456" y="192" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">orbit-100 #DDE4FF · text void-900 at 14.33 : 1 — the</text><text x="456" y="204" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">highest-traffic surface, so the most readable</text><rect x="440" y="220" width="460" height="54" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="238" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Type</text><text x="456" y="252" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">body 16 / 22, weight 400. Never smaller than 16 px — not for</text><text x="456" y="264" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">density, not on tablets</text><rect x="440" y="280" width="460" height="42" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="298" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Shadow</text><text x="456" y="312" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">none. Bubbles are content, not objects</text><rect x="440" y="328" width="460" height="54" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="346" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Delivery</text><text x="456" y="360" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">four states with distinct glyph geometry — pending, sent,</text><text x="456" y="372" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">delivered, read. Never colour alone</text><rect x="440" y="388" width="460" height="54" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="406" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Reactions</text><text x="456" y="420" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">one emoji per person; a compact pill below the bubble; tap to see</text><text x="456" y="432" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">who</text><rect x="440" y="448" width="460" height="42" rx="8" ry="8" fill="#F4F6FA"/><text x="456" y="466" font-family="Inter, 'Inter Display', sans-serif" font-size="10" fill="#2438AE" text-anchor="start" font-weight="700">Slots</text><text x="456" y="480" font-family="Inter, 'Inter Display', sans-serif" font-size="9" fill="#4C5464" text-anchor="start" font-weight="400">reply-quote · content · attachments · reactions · meta</text></svg>