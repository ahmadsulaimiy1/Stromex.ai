name: Android Build

on:
  push:
    branches:
      - claude/sajjil-audio-platform-fabrov
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Test, build debug APK, and (if signing secrets exist) build release APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Real, ground-truth verification of everything built in this environment without a
      # compiler available: core is pure Kotlin/JVM and was already unit-tested by hand in
      # sandbox sessions, but this is the first time it (and the app module) run through an
      # actual Android toolchain rather than the stripped-down :core-only workaround.
      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sajjil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release signing is opt-in: this repo has never had a real release keystore, and
      # generating one on the maintainer's behalf without their say-so would be the wrong
      # call (losing/rotating it silently breaks all future Play Store updates for good).
      # Add RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS /
      # RELEASE_KEY_PASSWORD as repository secrets (see docs/ANDROID_BUILD.md) to enable this.
      - name: Check for release signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.available == 'true'
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sajjil-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: No release secrets configured
        if: steps.signing.outputs.available == 'false'
        run: echo "Skipping release APK/AAB — no RELEASE_KEYSTORE_BASE64 secret configured. See docs/ANDROID_BUILD.md to add one. The debug APK above is still real and installable."

  # A real smoke test, not an assumption: boots an actual Android emulator, installs the
  # debug APK exactly as a user would, launches it, and fails the job if it crashes or ANRs
  # within the launch window. This verifies the app installs and starts — it does NOT cover
  # the full manual QA matrix (RTL, dark mode, tablet layouts, low-memory behavior, every user
  # journey) — see docs/ANDROID_VERIFICATION_REPORT.md for exactly what this does and doesn't
  # prove.
  emulator-smoke-test:
    name: Install and launch on an emulator (smoke test)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: sajjil-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # NOTE: this action runs each line of `script` as its own independent shell
          # invocation (confirmed from a real run's logs: every line appears as a separate
          # `sh -c '<that line>'`) rather than as one connected multi-line script. A multi-line
          # if/then/fi block therefore breaks with "Syntax error: end of file unexpected" --
          # every logical statement below must be self-contained on its own line.
          script: |
            adb logcat -c
            adb install -r apk/*.apk
            adb shell am start -n com.sajjil.app/.MainActivity
            sleep 12
            adb logcat -d > logcat.txt
            echo "--- last 100 lines of logcat ---"
            tail -n 100 logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt || grep -qi "ANR in com.sajjil.app" logcat.txt; then echo "CRASH OR ANR DETECTED ON LAUNCH -- see logcat above."; exit 1; fi
            RUNNING=$(adb shell "dumpsys activity activities | grep -c 'com.sajjil.app/.MainActivity'" || echo 0); if [ "$RUNNING" -eq 0 ]; then echo "MainActivity does not appear to be running after launch -- see logcat above."; exit 1; fi
            echo "PASS: com.sajjil.app installed, launched, and MainActivity was running 12s later with no fatal exception or ANR in logcat."
